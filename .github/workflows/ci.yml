name: CI

# Everything verified by hand during development should be verified
# automatically on every change. Without this, nothing stops a commit that
# breaks the build from reaching the branch a deployment tracks.
#
# `push` is limited to the two long-lived branches on purpose. Listing every
# branch here ran the whole suite twice for every pull request — once for the
# push to the feature branch, once for the PR — which doubled the wait and made
# the checks list ambiguous about which run mattered. Feature branches are
# covered by `pull_request`; `dev` and `main` still get a direct run, because
# those are the branches something is deployed from.
on:
  push:
    branches: [dev, main]
  pull_request:

# Read-only by default. A workflow with no `permissions` block inherits the
# repository default, which may be read/write — meaning any action running here
# holds a token that can push branches and edit releases. Nothing in this
# workflow writes to the repository, so nothing here needs more than read.
permissions:
  contents: read

# The actions below are pinned to a **commit SHA**, not a tag.
#
# `actions/checkout@v7` is a moving target: a major tag is repointed with every
# release, by design, so `@v7` means "whatever that tag names at the moment the
# job starts". That is a supply-chain path into a workflow holding a token — and
# it exists whether or not anyone is upgrading. A SHA is immutable, so the code
# that runs is the code that was reviewed.
#
# The trailing comment is the only human-readable part, and Dependabot rewrites
# both it and the hash together, so the automation survives the pinning. Version
# majors differ (v6 for cache, v7 for the rest) because they release
# independently — that is not an oversight.

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # `ci` rather than `install`: fails on a lockfile that disagrees with
      # package.json instead of quietly resolving something different from
      # what was tested locally.
      - name: Install dependencies
        run: npm ci

      # Ordered cheapest-first so an obvious failure reports in seconds
      # rather than after a full build.
      - name: Typecheck
        run: npx tsc --noEmit

      # The whole project, not just `src`. The end-to-end tests and the config
      # files are code that can break too, and they were unlinted while this
      # step named a single directory.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # A vulnerable transitive dependency is the likeliest realistic
      # compromise for an app with no database and no user-supplied content.
      # High and above fails; anything lower is noise on a demo.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  # The schema, the fixtures, and the repository layer against a real Postgres.
  #
  # Everything in `src/data/postgres` is otherwise tested against a recording
  # client, which proves the SQL text and nothing about whether Postgres accepts
  # it. The first time the schema was actually applied it failed on a missing
  # extension, two foreign keys pointing at users that do not exist, and a
  # market scoped by a column the table does not have — none of which any amount
  # of TypeScript would have caught. This job is what keeps that gap closed.
  database:
    name: Schema and repositories on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oppeco
          POSTGRES_PASSWORD: oppeco
          POSTGRES_DB: oppeco
        ports:
          - 5432:5432
        # Without this the job races the container: the steps below start
        # before Postgres is listening and fail on connection refused.
        options: >-
          --health-cmd "pg_isready -U oppeco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://oppeco:oppeco@localhost:5432/oppeco
      TEST_DATABASE_URL: postgresql://oppeco:oppeco@localhost:5432/oppeco

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The operator path, run exactly as a person would run it, so a break in
      # the scripts is a red check rather than a surprise during a deployment.
      - name: Prove the connection
        run: npm run db:verify

      - name: Apply migrations
        run: npm run db:migrate

      - name: Load the fixtures
        run: npm run db:seed

      # Re-applying must be a no-op: a migration runner that reruns applied
      # files is one that fails on the second deployment rather than the first.
      - name: Re-apply, expecting nothing to do
        run: npm run db:migrate

      - name: Run the database integration suite
        run: npx vitest run src/data/postgres/integration.test.ts

  # Runs alongside `verify` rather than after it. It repeats the install and
  # build, which costs about a minute of machine time and saves more than that
  # in wall-clock — and it means a browser-only failure can't be confused with
  # a typecheck failure.
  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keyed on the resolved Playwright version, so a dependency bump misses
      # the cache and downloads the browser build that version expects rather
      # than launching a mismatched one.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # A cached browser still needs the shared libraries it links against,
      # which live outside the cached directory.
      - name: Install browser system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # The suite runs against a production build, not the dev server: the CSP
      # and HSTS headers it asserts only exist in production.
      - name: Build
        run: npm run build

      - name: Run end-to-end and accessibility tests
        run: npm run test:e2e
        env:
          # The suite runs a production build, where `signDownloadUrl` refuses
          # to fall back to a predictable secret — a forgeable signature is the
          # failure that guard exists to prevent. Without this the deliverable
          # suite exercises the degraded path (a file received, no link issued)
          # rather than the real one. Test-only and committed on purpose: it
          # signs links to fixtures on a throwaway runner, and a repository
          # secret here would make the suite unrunnable on a fork.
          UPLOAD_URL_SECRET: end-to-end-suite-signing-key-not-a-real-secret

      # Traces and screenshots are only written for failures, so this uploads
      # nothing on a green run.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
